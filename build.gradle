plugins {
    id 'com.android.application' version '7.4.2'
}

android {
    namespace 'com.ajmst.android'
    compileSdk 19
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'com.ajmst.android'
        minSdk 14
        targetSdk 14
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.recovered'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
